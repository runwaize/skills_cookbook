[package]
name = "runwaize_skills_cookbook_cli"
version = "0.1.0"
description = "CLI companion for Runwaize Skills Cookbook (chef/guest, sync, install/doctor)"
authors = ["SUPERVAIZE Team"]
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "skills_cookbook"
path = "src/main.rs"

[dependencies]
skill-cookbook-relay = { path = ".." }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
