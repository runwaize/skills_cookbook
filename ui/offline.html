<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Cookbook Relay - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; }
        .status { margin: 1rem 0; padding: 1rem; background: #f0f0f0; border-radius: 4px; }
        button {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #statusData { text-align: left; font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Offline / Limited Mode</h1>
        <p>The Skills Studio website is currently unreachable.</p>
        <div class="status">
            <h3>Relay Status</h3>
            <div id="statusData">Loading...</div>
        </div>
        <button onclick="loadStatus()">Refresh Status</button>
        <button onclick="retry()">Retry Connection</button>
    </div>
    <script>
        const BRIDGE_PORT = 9123;
        async function loadStatus() {
            try {
                const res = await fetch(`http://127.0.0.1:${BRIDGE_PORT}/bridge/status`, {
                    headers: { 'X-Bridge-Token': 'placeholder' }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('statusData').textContent = JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('statusData').textContent = 'Error: ' + res.status;
                }
            } catch (e) {
                document.getElementById('statusData').textContent = 'Error: ' + e.message;
            }
        }
        function retry() {
            window.location.href = 'https://skills.runwaize.com';
        }
        loadStatus();
    </script>
</body>
</html>
